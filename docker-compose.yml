services:
  postgres:
    image: postgres:16
    container_name: stalcraft_wiki_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stalcraft_network

  backend:
    build:
      context: ./backend
    container_name: stalcraft_wiki_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}

      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - stalcraft_network

  frontend:
    build:
      context: ./frontend
    container_name: stalcraft_wiki_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - stalcraft_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  stalcraft_network: