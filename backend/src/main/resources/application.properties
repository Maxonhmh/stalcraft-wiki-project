spring.application.name=demo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stalcraft_wiki}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${APP_JWT_SECRET:dev-super-secret-jwt-key-must-be-longer-than-32-symbols}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin12345}

app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}